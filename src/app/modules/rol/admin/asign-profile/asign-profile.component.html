<div class="app-container">
  <app-header></app-header>
  <div class="container">
    <h1 class="subtitle">Asignar Perfil</h1>

    <div class="content">
      <mat-card class="center-card">
        <div class="card-header">
          <div class="avatar-container">
            <mat-icon class="person-icon">person</mat-icon>
            <mat-icon class="add-icon">add</mat-icon> <!-- Agregué el icono + para consistencia visual -->
          </div>
        </div>

        <!-- Campos de entrada -->
        <form [formGroup]="asignForm" (ngSubmit)="onSubmit()">
          <div class="card-body">
            
            <!-- Primera fila -->
            <div class="input-row">
              <div class="input-group">
                <label class="input-label">Código de Usuario (Cédula)</label>
                <mat-form-field appearance="outline">
                  <input matInput formControlName="codigoUsuario" placeholder="Ej. 12345678" autocomplete="off">
                  <mat-error *ngIf="asignForm.get('codigoUsuario')?.hasError('required')">Requerido</mat-error>
                </mat-form-field>
              </div>
              
              <div class="input-group">
                <label class="input-label">Rol</label>
                <mat-form-field appearance="outline">
                  <mat-select formControlName="rol">
                    <mat-option value="" disabled>Seleccione</mat-option>
                    <mat-option *ngFor="let rol of roles" [value]="rol.value">
                      {{ rol.viewValue }}
                    </mat-option>
                  </mat-select>
                  <mat-error *ngIf="asignForm.get('rol')?.hasError('required')">Requerido</mat-error>
                </mat-form-field>
              </div>
            </div>

            <!-- Segunda fila -->
            <div class="input-row">
              <div class="input-group">
                <label class="input-label">Nombre de Perfil</label>
                <mat-form-field appearance="outline">
                  <input matInput formControlName="nombrePerfil" placeholder="Nombre completo">
                  <mat-error *ngIf="asignForm.get('nombrePerfil')?.hasError('required')">Requerido</mat-error>
                </mat-form-field>
              </div>
              
              <div class="input-group">
                <label class="input-label">Clave</label>
                <mat-form-field appearance="outline">
                  <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="clave" autocomplete="new-password">
                  <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                  </button>
                  <mat-error *ngIf="asignForm.get('clave')?.hasError('required')">Requerido</mat-error>
                  <mat-error *ngIf="asignForm.get('clave')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
                </mat-form-field>
              </div>
            </div>

            <!-- Botón Crear -->
            <button mat-raised-button type="submit" class="update-button" [disabled]="asignForm.invalid">
              Crear Perfil
            </button>
          </div>
        </form>
      </mat-card>
    </div>
  </div>
  <app-footer></app-footer>
</div>
